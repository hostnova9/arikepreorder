<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login | ArikePreorder</title><link rel="stylesheet" href="/arike.css"><link rel="stylesheet" href="/auth.css"><style>.admin-wrap{min-height:100vh;display:grid;place-items:center;background:#f5f3f4;padding:24px}.admin-card{width:min(440px,100%);background:white;border-radius:24px;padding:30px;box-shadow:0 16px 50px #32102914}.admin-card h1{margin:8px 0}.admin-card input{width:100%;box-sizing:border-box;margin:7px 0 14px;padding:13px;border:1px solid #ddd;border-radius:12px}.admin-card button{width:100%}.lock{font-size:32px}</style></head><body><main class="admin-wrap"><section class="admin-card"><div class="lock">🔐</div><div class="brand">Arike<i>Preorder</i></div><h1>Admin Centre</h1><p class="muted">Authorized administrators only. Sign in with your Admin Centre credentials.</p><div id="msg"></div><form id="form"><label>Admin email</label><input id="email" type="email" autocomplete="username" required><label>Password</label><input id="password" type="password" autocomplete="current-password" required minlength="10"><button class="btn primary" type="submit">Sign in securely</button></form><p style="margin-top:18px"><a href="/login">← Customer/Seller login</a></p></section></main><script src="/admin-login.js"></script></body></html>
