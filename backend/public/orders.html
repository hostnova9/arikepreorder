<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/arike.css"><title>Orders | ArikePreorder</title></head><body><header class="top"><a class="brand" href="/dashboard">Arike<i>Preorder</i></a><div style="flex:1"></div><a class="btn soft" href="/dashboard">Marketplace</a></header><main class="content" style="max-width:850px;margin:auto"><small>ORDER CENTRE</small><h1>Your orders</h1><div id="orders"></div><div class="panel"><b>How tracking will work</b><p class="muted">Paid → Processing → Shipped → Delivered → Buyer confirms receipt. Help Pay orders belong to the cart owner, not the person who paid.</p></div></main><script>const t=localStorage.getItem('arike_token');if(!t)location.href='/login';fetch('/api/marketplace/orders',{headers:{Authorization:'Bearer '+t}}).then(r=>r.json()).then(d=>orders.innerHTML=d.orders.length?d.orders.map(o=>`<div class="order"><span class="status">${o.status}</span><b>Order #${o.id.slice(0,8).toUpperCase()}</b><p>₦${Number(o.amount).toLocaleString('en-NG')} · ${o.payment_method==='help_pay'?'Help Pay':'Wallet payment'}</p><small>${new Date(o.created_at).toLocaleString()}</small></div>`).join(''):'<div class="panel">No orders yet.</div>')</script></body></html>
