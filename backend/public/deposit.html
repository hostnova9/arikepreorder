<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deposit | ArikePreorder</title><link rel="stylesheet" href="/arike.css"><style>.deposit-wrap{max-width:620px;margin:28px auto}.amounts{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 18px}.amounts button{border:1px solid #e5d8df;background:#fff;border-radius:12px;padding:10px 13px}.pay-option{border:1px solid #eadfe5;border-radius:16px;padding:16px;margin:12px 0}.secure{font-size:13px;color:#6e6269;margin-top:14px}</style></head><body><header class="top"><a class="brand" href="/dashboard">Arike<i>Preorder</i></a><b>Deposit</b><div style="flex:1"></div><a class="btn soft" href="/wallet" style="text-decoration:none">← Wallet</a></header><main class="content deposit-wrap"><section class="panel"><h1>Add money</h1><p class="muted">Choose an amount, then continue to secure Paystack checkout.</p><div class="field"><label>Amount (₦)</label><input id="amount" type="number" min="100" step="100" placeholder="e.g. 10000"></div><div class="amounts"><button data-a="5000">₦5,000</button><button data-a="10000">₦10,000</button><button data-a="25000">₦25,000</button><button data-a="50000">₦50,000</button></div><div class="pay-option"><b>Paystack Checkout</b><p class="muted">Available payment options are presented securely by Paystack in test mode.</p></div><button class="btn primary" id="pay" style="width:100%">Continue to payment</button><p class="secure">Your wallet is credited only after the server verifies a successful payment.</p><div id="msg"></div></section></main><script src="/deposit.js"></script></body></html>
